<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leafguard</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#3B5BA9" id="theme-color">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Leafguard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --page: #E6EBF1;
    --panel: #FFFFFF;
    --ink: #172131;
    --slate: #5D6B7E;
    --rule: #D5DCE5;
    --soft: #F3F6F9;
    --plus: #2F6F5E;
    --warn: #A86A12;
    --bad: #B4372F;
    --acc: #3B5BA9;
    --sans: "Avenir Next", "Segoe UI Variable Text", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--page); color: var(--ink); font: 15px/1.45 var(--sans); font-variant-numeric: tabular-nums; }
  body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 32px 12px; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }

  .wallet { width: 100%; max-width: 400px; background: var(--panel); border-radius: 16px; border: 1px solid var(--rule);
    overflow: hidden; border-top: 6px solid var(--acc); }

  .top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
  .net { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 999px;
    background: var(--soft); font-size: 13px; cursor: pointer; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--slate); }
  .dot.on { background: var(--plus); }
  .dot.off { background: var(--bad); }
  .icon-btn { border: 1px solid var(--rule); background: var(--panel); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }

  .screen { padding: 20px 20px 24px; }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; flex: none; border-radius: 10px; display: grid; grid-template-columns: repeat(5, 1fr);
    overflow: hidden; background: var(--soft); }
  .avatar.big { width: 72px; height: 72px; border-radius: 16px; }
  .avatar span.on { background: var(--acc); }
  .who h1 { margin: 0; font-size: 17px; text-transform: capitalize; }
  .addr-btn { border: 0; background: none; padding: 0; color: var(--slate); font-family: var(--mono); font-size: 13px; cursor: pointer; }
  .addr-btn:hover { color: var(--ink); }

  .bal { text-align: center; margin: 28px 0 22px; }
  .bal .amt { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .bal .unit { font-size: 20px; color: var(--slate); font-weight: 500; margin-left: 6px; }

  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 22px; }
  .act { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none; cursor: pointer; font-size: 14px; padding: 4px; border-radius: 10px; }
  .act .circle { width: 44px; height: 44px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; font-size: 20px; line-height: 1; }
  .act:disabled { opacity: .45; cursor: not-allowed; }

  .list { list-style: none; margin: 0 -20px; padding: 0; }
  .list li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 20px; border-bottom: 1px solid var(--rule); }
  .list .t { font-weight: 600; text-transform: none; }
  .list .s { color: var(--slate); font-size: 13px; }
  .list .v { text-align: right; font-weight: 600; white-space: nowrap; }
  .list .v.plus { color: var(--plus); }
  .empty { color: var(--slate); padding: 20px 0 4px; text-align: center; }

  .key { padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin: 6px 0 4px; }
  .bar span { display: block; height: 100%; background: var(--acc); }
  .note { font-size: 13px; color: var(--slate); margin: 12px 0 0; }

  h2 { font-size: 18px; margin: 0 0 16px; }
  .back { border: 0; background: none; padding: 0; color: var(--slate); cursor: pointer; margin-bottom: 14px; font-size: 14px; }
  label.f { display: block; font-weight: 600; font-size: 14px; margin: 0 0 6px; }
  .in { width: 100%; padding: 11px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--soft); }
  .in.mono { font-family: var(--mono); font-size: 13px; }
  .field { margin-bottom: 14px; }
  .err { color: var(--bad); font-size: 13px; min-height: 1.3em; margin-top: 4px; }
  .contacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .contact { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--panel); border-radius: 999px;
    padding: 3px 10px 3px 4px; cursor: pointer; font-size: 13px; text-transform: capitalize; }
  .contact .avatar { width: 20px; height: 20px; border-radius: 5px; }
  .amount-row { display: flex; gap: 8px; }
  .amount-row .in { flex: 1; }
  .max { border: 1px solid var(--rule); background: var(--panel); border-radius: 10px; padding: 0 14px; cursor: pointer; }

  .btn { width: 100%; border: 0; background: var(--acc); color: #fff; border-radius: 999px; padding: 12px 16px; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }

  .review { border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
  .review .r { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; }
  .review .r + .r { border-top: 1px solid var(--rule); }
  .review .k { color: var(--slate); }
  .review .vv { text-align: right; }
  .pq { margin-top: 14px; padding: 10px 12px; background: var(--soft); border-radius: 10px; font-size: 13px; color: var(--slate); }

  .steps { list-style: none; padding: 0; margin: 4px 0 0; }
  .steps li { padding: 8px 0 8px 26px; position: relative; }
  .steps li::before { content: ""; position: absolute; left: 4px; top: 14px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--rule); }
  .steps li.done::before { background: var(--plus); border-color: var(--plus); }
  .steps li.now::before { border-color: var(--acc); }
  .steps li.err { color: var(--bad); }
  .steps li.err::before { border-color: var(--bad); background: var(--bad); }
  .big-done { text-align: center; padding: 8px 0 4px; }
  .big-done .amt { font-size: 28px; font-weight: 600; }

  .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 999px; background: var(--acc); color: #fff;
    font-size: 12px; line-height: 18px; text-align: center; }
  .vrow { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; border: 0;
    border-bottom: 1px solid var(--rule); background: none; padding: 12px 20px; cursor: pointer; }
  .vrow:hover { background: var(--soft); }
  .vrow .avatar { grid-row: span 2; width: 32px; height: 32px; border-radius: 8px; }
  .invite { margin: 12px 0; padding: 12px; border: 1px solid var(--acc); border-radius: 12px; }
  .invite .btns { margin-top: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule); background: var(--panel); border-radius: 999px;
    padding: 5px 12px; cursor: pointer; text-transform: capitalize; }
  .chip-btn[aria-pressed=true] { border-color: var(--acc); background: var(--acc); color: #fff; }
  .members { list-style: none; padding: 0; margin: 10px 0 0; }
  .members li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--rule); text-transform: capitalize; }
  .members .st { text-transform: none; color: var(--slate); font-size: 13px; }
  .members .st.ok { color: var(--plus); }
  .prop { border: 1px solid var(--rule); border-radius: 12px; padding: 12px; margin-top: 10px; }
  .prop .head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .prop .appr { font-size: 13px; color: var(--slate); margin: 6px 0 0; }
  .prop .btn { margin-top: 10px; padding: 9px 14px; }
  .status { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--rule); color: var(--slate); white-space: nowrap; }
  .status.sent { border-color: var(--plus); color: var(--plus); }
  .status.wait { border-color: var(--acc); color: var(--acc); }
  .status.bad { border-color: var(--bad); color: var(--bad); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 4px; }
  .msg { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--soft); margin: 12px 0 0; }
  .msg.bad { color: var(--bad); }
  .recv { text-align: center; }
  .recv .avatar { margin: 0 auto 14px; }
  .recv code { display: block; font-family: var(--mono); font-size: 15px; line-height: 1.7; word-spacing: 6px; padding: 14px; background: var(--soft);
    border-radius: 12px; margin: 10px 0 16px; word-break: break-all; }
  .center { text-align: center; }
  .muted { color: var(--slate); }
  .small { font-size: 13px; }

  /* ---- app shell: bottom tab bar, touch ---- */
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  button { touch-action: manipulation; }
  .top .net { margin-right: auto; }
  .nav { position: sticky; bottom: 0; z-index: 2; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel);
    border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom); }
  .nav[hidden] { display: none; }
  .nav button { position: relative; min-height: 56px; border: 0; background: none; cursor: pointer; color: var(--slate); font-size: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .nav button[aria-current=page] { color: var(--acc); font-weight: 600; }
  .nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav .badge { position: absolute; top: 6px; left: calc(50% + 6px); margin: 0; }
  h2.section { font-size: 15px; margin: 0 0 4px; }
  .pair { text-align: center; }
  .pair .avatar { margin: 0 auto; }
  .pair .in { text-align: center; font-family: var(--mono); font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
  .qr { width: 220px; max-width: 100%; margin: 6px auto 10px; background: #fff; border: 1px solid var(--rule); border-radius: 12px; padding: 8px; }
  .qr svg { display: block; width: 100%; height: auto; }
  .code { font-family: var(--mono); font-size: 20px; letter-spacing: 0.08em; font-weight: 600; }
  ol.how { padding-left: 20px; margin: 10px 0 0; text-align: left; }
  ol.how li { margin-bottom: 8px; }
  .mono { font-family: var(--mono); }
  .wrap { overflow-wrap: anywhere; }

  /* ---- phones and the installed app: full screen, no card ---- */
  @media (max-width: 560px), (display-mode: standalone) {
    html, body { background: var(--panel); }
    body { padding: 0; display: block; overscroll-behavior-y: none; }
    .wallet { max-width: none; min-height: 100vh; min-height: 100dvh; border: 0; border-radius: 0; display: flex; flex-direction: column; }
    #view { flex: 1; }
    .top { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); }
    .screen { padding-left: calc(20px + env(safe-area-inset-left)); padding-right: calc(20px + env(safe-area-inset-right)); }
    .in, .pair .in { font-size: 16px; }  /* 16px stops iOS zooming into a field */
    .back { padding: 10px 0; margin: -10px 0 4px; }
    .icon-btn { min-height: 34px; }
    .contact { padding: 6px 12px 6px 6px; }
    .contact .avatar { width: 24px; height: 24px; }
    .max { min-height: 44px; }
    .btn { padding: 14px 16px; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .screen { animation: in .18s ease-out; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  }
</style>
</head>
<body>
<div class="wallet" id="wallet">
  <div class="top">
    <button class="net" id="net-pill" type="button" title="Network settings"><span class="dot" id="dot"></span><span id="net-text">Connecting…</span></button>
    <button class="icon-btn" id="phone-btn" type="button" hidden>Phone</button>
    <button class="icon-btn" id="settings-btn" type="button">Network</button>
  </div>
  <div id="view"></div>
  <nav class="nav" id="nav" aria-label="Sections" hidden></nav>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (a) => a ? a.slice(0, 6) + "…" + a.slice(-4) : "";
const ACCENTS = ["#2F6F5E", "#3B5BA9", "#7C4A9E", "#2C7DA0", "#6A7B2E", "#A04E68"];
let S = null, A = [], screen = "home", tab = "activity", busy = false, sendDraft = { to: "", amount: "" }, jobView = null;
let V = null, vaultId = null, vaultMsg = null, newVault = { name: "", picked: [] }, propDraft = { to: "", amount: "" }, jobReturn = "home";
let needPair = false, pairMsg = "", P = null;

// A phone reaches the wallet computer over the LAN and proves it was paired with the wallet's pairing code. The code
// arrives in the QR link's #fragment (never sent to a server or logged) or is typed in, and is kept on this phone.
const PAIR_KEY = "pq-wallet-pairing-code";
const pairCode = () => { try { return localStorage.getItem(PAIR_KEY) || ""; } catch { return ""; } };
const setPairCode = (c) => { try { c ? localStorage.setItem(PAIR_KEY, c) : localStorage.removeItem(PAIR_KEY); } catch { /* private mode */ } };
function takePairLink() {
  const m = location.hash.match(/pair=([A-Za-z0-9-]+)/);
  if (m) { setPairCode(m[1]); history.replaceState(null, "", location.pathname); return true; }
  return false;
}
takePairLink();
window.addEventListener("hashchange", () => { if (takePairLink()) refresh(); });
const isLocal = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);

async function api(path, body) {
  const headers = body ? { "content-type": "application/json" } : {};
  if (pairCode()) headers.authorization = "Bearer " + pairCode();
  const r = await fetch(path, body ? { method: "POST", headers, body: JSON.stringify(body) } : { headers });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || `request failed (${r.status})`); e.pair = !!j.pair; throw e; }
  return j;
}

// ---- amounts, exact ----
function ethToWei(s) {
  s = String(s).trim();
  if (!/^\d+(\.\d{1,18})?$/.test(s)) return null;
  const [i, f = ""] = s.split(".");
  return BigInt(i) * 10n ** 18n + BigInt((f + "0".repeat(18)).slice(0, 18));
}
function eth(w, dp = 4) {
  w = BigInt(w);
  const i = w / 10n ** 18n, f = (w % 10n ** 18n).toString().padStart(18, "0").slice(0, dp).replace(/0+$/, "");
  return i.toLocaleString("en-US") + (f ? "." + f : "");
}

// ---- identity: an avatar drawn from the address, and an accent colour ----
function avatar(addr, cls = "") {
  const hex = (addr || "0x").slice(2).toLowerCase().padEnd(40, "0");
  let cells = "";
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const col = c < 3 ? c : 4 - c, on = parseInt(hex[r * 3 + col], 16) % 2 === 1;
    cells += `<span class="${on ? "on" : ""}"></span>`;
  }
  return `<div class="avatar ${cls}" aria-hidden="true">${cells}</div>`;
}
function hexOf(str) {  // a stable 40-hex-digit fingerprint for a name (FNV-1a, repeated)
  let out = "", h = 0x811c9dc5;
  for (let k = 0; out.length < 40; k++) {
    for (const ch of str + k) { h ^= ch.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
    out += h.toString(16).padStart(8, "0");
  }
  return "0x" + out.slice(0, 40);
}
const accentFor = (addr) => ACCENTS[parseInt((addr || "0x00").slice(2, 4), 16) % ACCENTS.length];

// ---- data ----
async function refresh() {
  try { S = await api("/api/state"); needPair = false; pairMsg = ""; }
  catch (e) {
    S = null;
    if (e.pair) {  // forget a rejected code, so polling does not count as more wrong guesses
      if (pairCode()) { pairMsg = e.message; setPairCode(""); }
      needPair = true;
    }
  }
  const n = S && S.network;
  $("dot").className = "dot " + (n && n.connected ? "on" : needPair ? "" : "off");
  $("net-text").textContent = needPair ? "Not paired" : !n ? "Wallet offline" : n.connected ? `PQ devnet, chain ${n.chainId}` : "Not connected";
  if (S && S.account) {
    document.documentElement.style.setProperty("--acc", accentFor(S.account.address));
    $("theme-color").content = accentFor(S.account.address);
    try { A = await api("/api/activity"); } catch { /* keep the last list */ }
  }
  document.title = S ? `${cap(S.name)}'s Leafguard` : "Leafguard";
  if (vaultId && (screen === "vault" || screen === "propose")) { try { V = await api("/api/vaults/" + vaultId); } catch { /* keep */ } }
  if (!busy && !isTyping()) render();
}
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;
const here = () => S && S.remote ? "on your wallet computer, not on this phone" : "on this computer";
const isTyping = () => ["send", "review", "propose", "newvault", "network"].includes(screen);

// ---- screens ----
function render() {
  const v = $("view");
  const home = !!(S && S.network.connected && S.account && screen === "home");
  $("nav").hidden = !home;
  if (home) $("nav").innerHTML = navBar();
  $("phone-btn").hidden = !S || S.remote;
  $("settings-btn").hidden = !S;
  if (!S && needPair) { v.innerHTML = pairScreen(); return; }
  if (!S) {
    v.innerHTML = isLocal ? `<div class="screen center"><p>The wallet process is not running.</p><p class="muted small">Start it with infra/wallets.sh start ${"&lt;name&gt;"}.</p></div>`
      : `<div class="screen center"><p>Cannot reach your wallet computer.</p><p class="muted small">Check that it is on, that the wallet runs with
          infra/wallets.sh start --lan, and that this phone is on the same Wi-Fi. Your keys are on that computer, not on this phone.</p>
          <button class="btn ghost" type="button" data-do="retry" style="margin-top:8px">Try again</button></div>`;
    return;
  }
  if (screen === "network") return v.innerHTML = networkScreen();
  if (screen === "phone") return v.innerHTML = phoneScreen();
  if (!S.network.connected) { v.innerHTML = networkScreen(true); return; }
  if (!S.account) { v.innerHTML = setupScreen(); return; }
  v.innerHTML = { home: homeScreen, send: sendScreen, review: reviewScreen, receive: receiveScreen, job: jobScreen,
                  vault: vaultScreen, propose: proposeScreen, newvault: newVaultScreen }[screen]();
  if (screen === "send") { $("to").value = sendDraft.to; $("amt").value = sendDraft.amount; }
  if (screen === "propose") { $("pto").value = propDraft.to; $("pamt").value = propDraft.amount; }
  if (screen === "newvault") $("vname").value = newVault.name;
}

const NAV = [
  ["activity", "Wallet", '<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/><path d="M15 12h3"/>'],
  ["vaults", "Vaults", '<path d="M12 3l8 3v5.5c0 4.6-3.3 8.4-8 9.5-4.7-1.1-8-4.9-8-9.5V6z"/><path d="M9 12l2 2 4-4"/>'],
  ["keys", "Keys", '<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/>'],
];
function navBar() {
  return NAV.map(([k, label, icon]) => `<button type="button" data-tab="${k}" ${tab === k ? 'aria-current="page"' : ""}>
    <svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>${label}${k === "vaults" ? vaultBadge() : ""}</button>`).join("");
}

function homeScreen() {
  const a = S.account;
  if (tab === "vaults") return `<div class="screen"><h2>Shared vaults</h2>${vaultsList()}</div>`;
  if (tab === "keys") return `<div class="screen"><h2>Keys</h2>${keysList()}</div>`;
  return `<div class="screen">
    <div class="who">${avatar(a.address)}<div><h1>${esc(S.name)}</h1>
      <button class="addr-btn" type="button" data-copy="${esc(a.address)}" title="Copy address">${short(a.address)}, copy</button></div></div>
    <div class="bal"><span class="amt">${eth(a.balanceWei)}</span><span class="unit">ETH</span></div>
    <div class="actions">
      <button class="act" type="button" data-go="send"><span class="circle">↑</span>Send</button>
      <button class="act" type="button" data-go="receive"><span class="circle">↓</span>Receive</button>
      <button class="act" type="button" data-do="faucet"><span class="circle">+</span>Add test ETH</button>
    </div>
    <h2 class="section">Activity</h2>
    ${activityList()}
  </div>`;
}

function describe(r) {
  const who = r.name && !/^(Account setup|Mempool stake|Test ETH faucet)$/.test(r.name) ? cap(r.name) : short(r.counterparty);
  if (r.direction === "in") return r.name === "Account setup" ? "Account created" : r.name === "Test ETH faucet" ? "Test ETH added" : `Received from ${who}`;
  return r.name === "Mempool stake" ? "Mempool stake" : `Sent to ${who}`;
}

}

let quote = null;
function feeWhy() {  // why this payment costs more than the usual ~380k gas, from the wallet's send plan
  if (!quote || !quote.plan) return "";
  const why = [];
  if (quote.plan.some((t) => t.what === "renew")) why.push("renews a nearly used-up key first (an extra transaction)");
  if (quote.plan.some((t) => t.kinds.includes("stateless"))) why.push("a used-up key signs with its larger backup signature");
  if (quote.plan.some((t) => t.newStorage)) why.push("first use of a key records it on chain once");
  return `<br><span class="muted small">${(quote.gas || 0).toLocaleString("en-US")} gas${why.length ? "; " + esc(why.join("; ")) : ""}</span>`;
}

  return `<div class="screen"><button class="back" type="button" data-go="send">← Edit</button><h2>Review</h2>

      <div class="r"><span class="k">To</span><span class="vv">${c ? esc(cap(c.name)) + "<br>" : ""}<span class="muted small mono">${short(to)}</span></span></div>

      <div class="r"><span class="k">Network fee</span><span class="vv">about ${quote ? eth(quote.feeWei, 5) : "…"} ETH${feeWhy()}</span></div>

}

function vaultBadge() {
  const n = (S.vaults || []).reduce((k, v) => k + v.awaitingMe + (v.invited ? 1 : 0), 0);
  return n ? `<span class="badge" aria-label="${n} waiting for you">${n}</span>` : "";
}
function vaultState(v) {
  if (v.status === "active") return `${eth(v.balanceWei)} ETH`;
  const joined = v.members.filter((m) => m.joined).length;
  if (v.status === "deploying") return "Being created…";
  return joined < 3 ? `Waiting for guardians, ${joined} of 3 joined` : "Ready to create";
}

function proposalStatus(p) {
  return p.status === "sent" ? `<span class="status sent">Sent</span>`
    : p.status === "pending" ? `<span class="status wait">Needs approval</span>`
    : p.status === "ready" ? `<span class="status wait">Approved</span>`
    : p.status === "submitting" ? `<span class="status wait">Sending…</span>`
    : `<span class="status bad">${esc(cap(p.status))}</span>`;
}
function friendlyErr(e) {
  if (/expired/i.test(e)) return "Another vault payment went first; propose it again.";
  if (/rejected|reverted|simulat/i.test(e)) return "The network rejected it; propose it again.";
  return e.slice(0, 120);
}
function vaultScreen() {
  if (!V) return `<div class="screen"><button class="back" type="button" data-go="home">← Back</button><p class="muted">Loading…</p></div>`;
  const me = V.members.find((m) => m.me), joined = V.members.filter((m) => m.joined).length;
  const members = V.members.map((m) => `<li><span>${esc(m.wallet)}${m.me ? " (you)" : ""}</span>
      <span class="st ${m.joined ? "ok" : ""}">${m.joined ? (V.status === "active" ? "guardian" : "accepted") : "invited"}</span></li>`).join("");
  let top;
  if (V.status === "active") {
    top = `<div class="bal" style="margin:18px 0 14px"><span class="amt">${eth(V.balanceWei)}</span><span class="unit">ETH</span></div>
      <div class="two"><button class="btn" type="button" data-go="propose">Propose payment</button>
        <button class="btn ghost" type="button" data-deposit="${esc(V.address)}">Deposit</button></div>`;
  } else if (V.invited) {
    top = `<p class="msg">${esc(cap(V.creator))} invited you. Accepting creates your key for this vault ${here()}.</p>
      <div class="two"><button class="btn ghost" type="button" data-go="home">Not now</button><button class="btn" type="button" data-join="${V.id}">Accept</button></div>`;
  } else if (joined === 3 && V.status === "inviting") {
    top = `<p class="msg">Everyone accepted. Create the vault on chain (the devnet pays the 0.02 ETH mempool stake and adds 0.5 test ETH).</p>
      <button class="btn" type="button" data-deploy="${V.id}" style="margin-top:12px">Create vault</button>`;
  } else {
    top = `<p class="msg">Waiting for ${V.members.filter((m) => !m.joined).map((m) => esc(cap(m.wallet))).join(" and ")} to accept.</p>`;
  }
  const props = (V.proposals || []).slice(0, 12).map((p) => {
    const mine = me && p.approvals.some((a) => a.index === me.index);
    const toName = (S.contacts.find((c) => c.address.toLowerCase() === p.to.toLowerCase()) || {}).name
      || (S.account && S.account.address.toLowerCase() === p.to.toLowerCase() ? "you" : short(p.to));
    const action = p.status === "pending" && !mine ? `<button class="btn" type="button" data-approve="${p.id}">Approve</button>`
      : p.status === "ready" || (p.status === "failed" && p.approvals.length >= 2) ? `<button class="btn" type="button" data-submitp="${p.id}">Send now</button>` : "";
    return `<div class="prop"><div class="head"><span>Pay ${eth(p.wei, 18)} ETH to ${esc(cap(toName))}</span>${proposalStatus(p)}</div>
      <p class="appr">Approved by ${p.approvals.map((a) => esc(a.wallet === S.name ? "you" : cap(a.wallet)) + (a.kind === "stateless" ? " (stateless)" : "")).join(" and ")},
        ${p.approvals.length} of 2${p.block ? `, block ${p.block.toLocaleString("en-US")}` : ""}${p.status === "expired" ? ". Another vault payment went first; propose it again." : ""}${p.status === "failed" && p.error ? `. ${esc(friendlyErr(p.error))}` : ""}</p>${action}</div>`;
  }).join("");
  const acts = (V.activity || []).slice(0, 10).map((r) => `<li><span class="t">${esc(describe(r).replace("Account created", "Vault created"))}</span>
      <span class="v ${r.direction === "in" ? "plus" : ""}">${r.direction === "in" ? "+" : "−"}${eth(r.wei)} ETH</span>
      <span class="s">block ${r.block.toLocaleString("en-US")}</span><span></span></li>`).join("");
  return `<div class="screen"><button class="back" type="button" data-go="home">← Back</button>
    <div class="who">${avatar(V.address || hexOf(V.id))}<div><h1 style="text-transform:none">${esc(V.name)}</h1>
      ${V.address ? `<button class="addr-btn" type="button" data-copy="${esc(V.address)}">${short(V.address)}, copy</button>` : `<span class="muted small">2 of 3 multisig vault</span>`}</div></div>
    ${vaultMsg ? `<p class="msg ${vaultMsg.bad ? "bad" : ""}">${esc(vaultMsg.text)}</p>` : ""}
    ${top}
    <h2 style="margin-top:22px;font-size:15px">Guardians, any 2 of 3 approve</h2><ul class="members">${members}</ul>
    ${V.myKey ? `<p class="note">Your key for this vault: ${V.myKey.remaining} of ${V.myKey.leaves} approvals left.</p>` : ""}
    ${V.status === "active" ? `<h2 style="margin-top:22px;font-size:15px">Payments</h2>${props || `<p class="empty">No payments yet.</p>`}
      ${acts ? `<h2 style="margin-top:22px;font-size:15px">Activity</h2><ul class="list">${acts}</ul>` : ""}` : ""}</div>`;
}

const STEP = {
  log: (e) => /^keys:/.test(e.text) ? "Generating your three post-quantum keys"
    : /^account:/.test(e.text) ? "Creating your smart account on chain"
    : /^done:/.test(e.text) ? "Added 1 test ETH"
    : /^faucet:/.test(e.text) ? "Requesting test ETH from the devnet faucet" : null,
  renew: () => "Renewing a key that is almost used up",
  fallback: () => "A key is used up: signing with its backup key instead",
  signing: () => "Signing with two of your keys",
  simulated: (e) => e.ok ? "Checked: the network will accept it" : "The network would reject this payment",
  submitting: () => "Sent to the mempool, waiting for a block",
  included: (e) => `Confirmed in block ${e.block.toLocaleString("en-US")}`,
};
STEP.log = ((base) => (e) => base(e) || (/^vault: deploying/.test(e.text) ? "Creating the vault on chain" : null))(STEP.log);

async function runJob(path, body, title, doneHtml, back = "home") {
  busy = true; screen = "job"; jobReturn = back;
  jobView = { title, steps: [{ text: "Starting…" }], running: true }; render();
  let id;
  try { id = (await api(path, body)).job; } catch (e) {
    jobView = { title, steps: [{ text: e.message, err: true }], running: false, ok: false }; busy = false; render(); return;
  }
  for (;;) {
    await new Promise((r) => setTimeout(r, 900));
    let j; try { j = await api("/api/jobs/" + id); } catch { continue; }
    const steps = [];
    for (const e of j.events) { const f = STEP[e.type]; const t = f && f(e); if (t && (!steps.length || steps[steps.length - 1].text !== t)) steps.push({ text: t }); }
    if (j.state === "error") steps.push({ text: j.error, err: true });
    jobView = { title, steps: steps.length ? steps : [{ text: "Working…" }], running: j.state === "running",
                ok: j.state === "done", done: doneHtml };
    render();
    if (j.state !== "running") break;
  }
  busy = false;
  await refresh();
  if (screen === "job") render();
}

async function watchJob(id, title, doneHtml) {
  busy = true; screen = "job"; jobReturn = "vault";
  jobView = { title, steps: [{ text: "Signing with your vault key" }], running: true }; render();
  for (;;) {
    await new Promise((r) => setTimeout(r, 900));
    let j; try { j = await api("/api/jobs/" + id); } catch { continue; }
    const steps = [{ text: "Approved with your vault key" }];
    for (const e of j.events) { const f = STEP[e.type]; const tx = f && f(e); if (tx && steps[steps.length - 1].text !== tx) steps.push({ text: tx }); }
    if (j.state === "error") steps.push({ text: j.error, err: true });
    jobView = { title, steps, running: j.state === "running", ok: j.state === "done", done: doneHtml };
    render();
    if (j.state !== "running") break;
  }
  busy = false; await refresh();
}

// ---- events ----
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.id === "settings-btn" || t.id === "net-pill") { screen = "network"; return render(); }
  if (t.id === "phone-btn") { screen = "phone"; P = null; render(); try { P = await api("/api/pair"); } catch { P = { enabled: false }; } return render(); }
  if (t.dataset.go) {
    if (busy && screen === "job" && jobView && jobView.running) return;
    if (t.dataset.go === "vault" && vaultId) return openVault(vaultId);
    screen = t.dataset.go; if (screen === "home") vaultMsg = null; return render();
  }
  if (t.dataset.vault) return openVault(t.dataset.vault);
  if (t.dataset.pickw) {
    const w = t.dataset.pickw; newVault.name = $("vname").value;
    newVault.picked = newVault.picked.includes(w) ? newVault.picked.filter((x) => x !== w) : [...newVault.picked, w].slice(-2);
    return render();
  }
  if (t.dataset.join) {
    try { await api(`/api/vaults/${t.dataset.join}/join`, {}); await refresh(); return openVault(t.dataset.join, { text: "You joined. Your key for this vault is ready." }); }
    catch (e) { return openVault(t.dataset.join, { text: e.message, bad: true }); }
  }
  if (t.dataset.deploy) return runJob(`/api/vaults/${t.dataset.deploy}/deploy`, {}, "Creating the vault", "<p>The vault is ready.</p>", "vault");
  if (t.dataset.deposit) { sendDraft = { to: t.dataset.deposit, amount: "" }; screen = "send"; return render(); }
  if (t.dataset.pto) { $("pto").value = t.dataset.pto; propDraft.to = t.dataset.pto; return; }
  if (t.dataset.approve) {
    let r;
    try { r = await api(`/api/vaults/${vaultId}/proposals/${t.dataset.approve}/approve`, {}); }
    catch (e) { return openVault(vaultId, { text: e.message, bad: true }); }
    if (!r.job) return openVault(vaultId, { text: "Approved. It is sent when one more guardian approves." });
    return watchJob(r.job, "Sending the vault payment", "<p>Paid from the vault.</p>");
  }
  if (t.dataset.submitp) return runJob(`/api/vaults/${vaultId}/proposals/${t.dataset.submitp}/submit`, {}, "Sending the vault payment", "<p>Paid from the vault.</p>", "vault");
  if (t.dataset.tab) { tab = t.dataset.tab; window.scrollTo(0, 0); return render(); }
  if (t.dataset.share) { try { await navigator.share({ title: `${cap(S.name)}'s address`, text: t.dataset.share }); } catch { /* dismissed */ } return; }
  if (t.dataset.copy) {
    const prev = t.textContent;
    try { await navigator.clipboard.writeText(t.dataset.copy); t.textContent = "Copied"; } catch { t.textContent = t.dataset.copy; }
    setTimeout(() => { t.textContent = prev; }, 1500); return;
  }
  if (t.dataset.to) { $("to").value = t.dataset.to; sendDraft.to = t.dataset.to; return; }
  if (t.id === "max") {
    try { const q = await api("/api/quote"); $("amt").value = eth(q.maxSendWei, 18).replace(/,/g, ""); } catch { /* ignore */ } return;
  }
  const act = t.dataset.do;
  if (act === "retry") return refresh();
  if (act === "unpair") { setPairCode(""); screen = "home"; return refresh(); }
  if (act === "create") return runJob("/api/create", {}, `Creating ${cap(S.name)}'s wallet`,
    `<p>Your wallet is ready.</p>`);
  if (act === "faucet") return runJob("/api/faucet", {}, "Adding test ETH", `<div class="amt">+1 ETH</div><p class="muted">Test ETH added.</p>`);
  if (act === "confirm") {
    const wei = ethToWei(sendDraft.amount);
    return runJob("/api/send", { to: sendDraft.to, wei: wei.toString() }, "Sending",
      `<div class="amt">−${esc(eth(wei, 18))} ETH</div><p class="muted">Sent to ${esc((S.contacts.find((c) => c.address.toLowerCase() === sendDraft.to.toLowerCase()) || {}).name ? cap(S.contacts.find((c) => c.address.toLowerCase() === sendDraft.to.toLowerCase()).name) : short(sendDraft.to))}.</p>`);
  }
});

document.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  if (ev.target.id === "send-form") {
    const to = $("to").value.trim(), amt = $("amt").value.trim(), wei = ethToWei(amt);
    sendDraft = { to, amount: amt };
    $("to-err").textContent = !/^0x[0-9a-fA-F]{40}$/.test(to) ? "Enter a 0x address with 40 hex characters."
      : to.toLowerCase() === S.account.address.toLowerCase() ? "That is your own address." : "";
    let q = null; try { q = await api("/api/quote"); } catch { /* checked again by the wallet */ }
    $("amt-err").textContent = wei === null || wei <= 0n ? "Enter an amount such as 0.01."
      : q && wei > BigInt(q.maxSendWei) ? `You can send up to ${eth(q.maxSendWei, 6)} ETH (the rest covers the network fee).` : "";
    if ($("to-err").textContent || $("amt-err").textContent) return;
    quote = q; screen = "review"; return render();
  }
  if (ev.target.id === "vault-form") {
    newVault.name = $("vname").value.trim();
    try { const v = await api("/api/vaults", { name: newVault.name, guardians: newVault.picked }); newVault = { name: "", picked: [] };
          await refresh(); return openVault(v.id, { text: "Invitations sent. The vault is created once both accept." }); }
    catch (e) { $("v-err").textContent = e.message; } return;
  }
  if (ev.target.id === "prop-form") {
    const to = $("pto").value.trim(), amt = $("pamt").value.trim(), wei = ethToWei(amt);
    propDraft = { to, amount: amt };
    $("pto-err").textContent = /^0x[0-9a-fA-F]{40}$/.test(to) ? "" : "Enter a 0x address with 40 hex characters.";
    $("pamt-err").textContent = wei === null || wei <= 0n ? "Enter an amount such as 0.05." : "";
    if ($("pto-err").textContent || $("pamt-err").textContent) return;
    try { await api(`/api/vaults/${vaultId}/propose`, { to, wei: wei.toString() }); propDraft = { to: "", amount: "" };
          return openVault(vaultId, { text: "Proposed and approved by you. One more guardian must approve." }); }
    catch (e) { $("pamt-err").textContent = e.message; } return;
  }
  if (ev.target.id === "pair-form") {
    const c = $("pcode").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (c.length < 12) { pairMsg = "Enter the 12-character code."; return render(); }
    setPairCode(c); pairMsg = ""; return refresh();
  }
  if (ev.target.id === "net-form") {
    try { await api("/api/network", { ethrex: $("rpc").value.trim(), sidecar: $("mp").value.trim() }); screen = "home"; await refresh(); }
    catch (e) { $("net-err").textContent = e.message; }
  }
});

refresh();
setInterval(() => { if (!busy && !document.hidden && !needPair && (["home", "vault"].includes(screen) || !S || !S.network.connected)) refresh(); }, 4000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !busy && !isTyping()) refresh(); });  // back from the background
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("/sw.js").catch(() => { /* still works without */ });
</script>
