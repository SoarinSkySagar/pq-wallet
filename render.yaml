# Render Blueprint: the Leafguard web service (wallets alice/bob/carol, explorer, gateway) as one Docker service.
# The chain and the alt mempool run on your own server (./start.sh there); this service talks to them.
# Render dashboard: New > Blueprint > this repository, then fill in the four values printed on the chain server by
#   infra/render/export-env.sh <server public IP>
# Devnet only, never real funds. Guide: infra/render/README.md
services:
  - type: web
    name: leafguard
    runtime: docker
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    plan: starter               # ~300 MB in use; the free plan works too but sleeps when idle and has no disk
    healthCheckPath: /healthz
    disk:                       # keeps the wallets' keys and accounts across restarts and deploys
      name: leafguard-devnet
      mountPath: /app/.devnet
      sizeGB: 1
    envVars:
      - key: ETHREX_RPC         # e.g. http://203.0.113.7:32003
        sync: false
      - key: SIDECAR_RPC        # e.g. http://203.0.113.7:14337/rpc
        sync: false
      - key: DEPLOYMENT_JSON    # one line of JSON with the contract addresses
        sync: false
      - key: DEPLOYER_KEY       # throwaway devnet deployer key (funds account setup and test ETH)
        sync: false
      - key: ALICE_PAIR_CODE    # optional: 12 characters A-Z (no I/O) and 2-9, e.g. K7QM-P3XA-WN9D
        sync: false
